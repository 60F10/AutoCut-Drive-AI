name: AutoCut Cloud Render
run-name: cloud-render ${{ inputs.job_file_id }}

on:
  workflow_dispatch:
    inputs:
      job_file_id:
        description: 'ID del archivo job_<id>.json o analyze_<id>.json en _AutoCut_Jobs (opcional; vacío procesa todos los pendientes)'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: cloud-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WHISPER_MODEL: ${{ vars.WHISPER_MODEL || 'small' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install faster-whisper
        run: pip install "faster-whisper==1.*" "av<16"

      - name: Cache Whisper HuggingFace models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-${{ env.WHISPER_MODEL }}-v1

      - name: Install native FFmpeg (BtbN static GPL with zscale)
        run: |
          mkdir -p "$HOME/ffmpeg-btbn"
          curl -fsSL "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz" -o "$HOME/ffmpeg-btbn/ffmpeg.tar.xz"
          tar -xJf "$HOME/ffmpeg-btbn/ffmpeg.tar.xz" -C "$HOME/ffmpeg-btbn" --strip-components=1
          rm -f "$HOME/ffmpeg-btbn/ffmpeg.tar.xz"
          echo "$HOME/ffmpeg-btbn/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/ffmpeg-btbn/bin:$PATH"
          ffmpeg -version | head -1
          ffmpeg -hide_banner -filters | grep zscale

      - name: Run AutoCut Cloud Worker
        env:
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          AUTOCUT_ROOT_FOLDER_ID: ${{ secrets.AUTOCUT_ROOT_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          WHISPER_MODEL: ${{ env.WHISPER_MODEL }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "::add-mask::$GEMINI_API_KEY"
          fi
          node worker/cloud-worker.mjs --job-file-id "${{ inputs.job_file_id }}"
